<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Da Studio a Impresa 2027 | Dental Business Model</title>
  <style>html,body{margin:0;background:#07192b;color:white;font-family:Arial,sans-serif}body{min-height:100vh;display:grid;place-items:center}.loading{text-align:center}.loading strong{display:block;font-family:Georgia,serif;font-size:30px;font-weight:400}.loading span{display:block;margin-top:12px;color:#9ce8ee;font-size:11px;letter-spacing:.15em;text-transform:uppercase}</style>
</head>
<body>
  <div class="loading"><strong>Dental Business Model</strong><span>Caricamento del percorso…</span></div>
  <script>
    Promise.all(["00","01","02","03"].map(function(n){return fetch("assets/page-"+n+".txt").then(function(r){if(!r.ok)throw new Error("Caricamento non riuscito");return r.text();});}))
      .then(function(parts){document.open();document.write(parts.join(""));document.close();})
      .catch(function(){document.body.innerHTML='<div class="loading"><strong>Riprova tra qualche istante.</strong><span>Pubblicazione in corso</span></div>';});
  </script>
</body>
</html>
